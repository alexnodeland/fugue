[workspace]
members = [".", "crates/fugue-wasm"]
# docs/ holds a standalone helper package (fugue-docs-tests) with its own
# manifest; keep it out of the workspace so its resolution stays independent.
exclude = ["docs"]

[package]
name = "fugue-ppl"
version = "0.2.3"
edition = "2021"
# Finding FG-51: the README previously claimed "1.70+" with nothing pinning or
# verifying it. Verified empirically against real toolchains (not just
# clippy's `incompatible_msrv` lint, which agrees): rustc 1.70.0 actually
# fails to compile this crate for two independent reasons -- an `E0659`
# ambiguous-name error on `pub mod core` vs. the `core` extern-prelude crate
# (resolved by later rustc versions), and `usize::is_multiple_of` in
# `src/inference/abc.rs`, stable only since 1.87.0. rustc 1.87.0 compiles
# `[dependencies]` (the graph a downstream consumer actually pulls in)
# cleanly with zero `incompatible_msrv` findings anywhere in the crate.
# dev-dependencies (criterion) are NOT held to this floor -- bench tooling,
# not part of the published library -- so the MSRV CI job
# (.github/workflows/ci.yml) checks `--lib` only, against a temporarily
# dev-dependency-free manifest. See that job's comments for why.
rust-version = "1.87"
license = "MIT"
description = "Monadic PPL with numerically stable inference and comprehensive diagnostics."
readme = "README.md"
keywords = ["probability-monad", "ppl", "monad", "effects", "traces"]
categories = ["science", "mathematics"]
documentation = "https://docs.rs/fugue-ppl"
repository = "https://github.com/alexnodeland/fugue"


[lib]
name = "fugue"

[package.metadata.docs.rs]
# Enable all features for documentation
all-features = true
# Use nightly for better documentation features
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
# Core dependencies
rand = "0.8"
rand_distr = "0.4"
libm = "0.2"

[dev-dependencies]
# Benchmarking dependencies
criterion = { version = "0.5", features = ["html_reports"] }
# FG-N8: `cargo-llvm-cov`, `mdbook` and its five plugins used to be listed
# here. They are *binaries* the maintainer runs, not libraries this crate
# links, and declaring them as dev-dependencies compiled their whole
# dependency trees (reqwest, tokio, ...) into every `cargo test` and
# `cargo clippy --all-targets` for nothing -- 461 lock packages, now 99.
# They are installed with `cargo install` instead: see `make install-dev-tools`,
# the coverage workflow (`cargo install cargo-llvm-cov`) and the docs workflow
# (`cargo install mdbook ...`). `clap` and `proptest` were declared but not
# referenced by any target and went at the same time.

[[bench]]
name = "mcmc_benchmarks"
harness = false

[[bench]]
name = "f_perf"
harness = false

[[bench]]
name = "sequence_vec"
harness = false
